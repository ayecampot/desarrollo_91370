                <figcaption>La gastronomía argentina está profundamente influenciada por las culturas española e italiana, cuyas tradiciones llegaron con las grandes oleadas migratorias. De España heredamos platos como las tortillas, los guisos, las empanadas y el uso del aceite de oliva. La inmigración italiana popularizó las pastas, las pizzas, los ñoquis y las milanesas. Estas costumbres se fusionaron con los ingredientes y las tradiciones locales, dando origen a una identidad culinaria propia. Hoy, el asado, las pastas del domingo y la pizza al molde son ejemplos de cómo ambas culturas forman parte de la mesa argentina.</figcaption>
